name: CI

# ==================================================================================
# Every job below assumes the required libraries are installed via requirements.txt.
# The `drift-check` job assumes GitHub-hosted runners' real internet access to poll
# Open-Meteo.
#
# No repository secrets are required: every real data source used (household dataset,
# Open-Meteo historical + live weather) is free and keyless.
# ==================================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # schedule:
  #  - cron: "0 3 * * *"   # Nightly automated drift-check + auto-retrain
  workflow_dispatch:      # Allow manual triggering from the Actions tab

env:
  PYTHON_VERSION: "3.11"
  MLFLOW_TRACKING_URI: "sqlite:///${{ github.workspace }}/mlflow.db"

jobs:
  # --------------------------------------------------------------------- #
  # 1. Lint — fastest possible feedback.
  # --------------------------------------------------------------------- #
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - run: ruff check --ignore I001 src/ tests/ scripts/

  # --------------------------------------------------------------------- #
  # 2. Unit tests — the dependency-light suite plus every
  #    importorskip-gated suite (mlflow/evidently/river/fastapi/GE).
  # --------------------------------------------------------------------- #
  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-results, path: reports/junit.xml }

  # --------------------------------------------------------------------- #
  # 3. Data pipeline smoke test — Real household dataset + Open-Meteo 
  #    ingestion (network is available on GitHub-hosted runners), validated
  #    with real Great Expectations.
  # --------------------------------------------------------------------- #
  data-pipeline-smoke-test:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the Sprint 1-3 pipeline end-to-end (Real household dataset + Open-Meteo data)
        run: python3 scripts/run_pipeline.py
      - name: Fail the build on CRITICAL data-quality failures (Great Expectations)
        run: python3 -m src.data_engineering.validate
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: data-quality-report, path: reports/data_quality_report.json }
      - uses: actions/upload-artifact@v4
        with: { name: feature-store, path: data/feature_store/ }

  # --------------------------------------------------------------------- #
  # 4. ML kernel — trains all 4 candidates (Linear/RandomForest/XGBoost/
  #    LightGBM) via MLflow, fails the build if the champion doesn't
  #    beat the naive baseline, uploads the MLflow run store + model
  #    registry pickle artifacts.
  # --------------------------------------------------------------------- #
  ml-kernel:
    needs: data-pipeline-smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 scripts/run_pipeline.py
      - name: Train + compare 4 models (MLflow), fail build if champion doesn't beat baseline
        run: |
          python3 -c "
          from src.ml.train import train_and_compare
          import sys
          results = train_and_compare()
          champion = results['champion']
          improvement = results[champion]['improvement_vs_baseline_mae_pct']
          print(f'Champion {champion}: {improvement:.1f}% MAE improvement vs baseline')
          sys.exit(0 if improvement > 0 else 1)
          "
      - uses: actions/upload-artifact@v4
        with: { name: mlflow-tracking-store, path: mlruns/ }
      - uses: actions/upload-artifact@v4
        with: { name: model-registry-pickles, path: model_registry_pickles/ }

  # --------------------------------------------------------------------- #
  # 5. Explainability — real SHAP summary plot for the champion model,
  #    uploaded as a build artifact (viewable from the Actions run page).
  # --------------------------------------------------------------------- #
  explainability:
    needs: ml-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 scripts/run_pipeline.py
      - run: python3 scripts/train_models.py
      - name: Generate the champion's SHAP summary plot
        run: |
          python3 -c "
          from src.feature_store.store import FeatureStore
          from src.ml.dataset import chronological_split, Xy
          from src.ml.registry import ModelRegistry
          from src.ml.explain import compute_shap_values, save_summary_plot
          from src.common.config import DEFAULT_CONFIG

          store = FeatureStore()
          df = store.read_features()
          split = chronological_split(df, DEFAULT_CONFIG)
          registry = ModelRegistry()
          # explain the most recently trained xgboost run's version (Staging by this point)
          versions = registry.list_versions('consumption_forecaster__xgboost')
          latest = max(versions, key=lambda v: v.version)
          model, meta = registry.load_version('consumption_forecaster__xgboost', latest.version)
          X_val, y_val = Xy(split.val, meta.feature_columns)
          X_val = X_val.fillna(X_val.median(numeric_only=True)).sample(n=min(500, len(X_val)), random_state=42)
          shap_values = compute_shap_values(model, X_val)
          save_summary_plot(shap_values)
          "
      - uses: actions/upload-artifact@v4
        with: { name: shap-summary-plot, path: reports/shap_summary_plot.png }

  # --------------------------------------------------------------------- #
  # 6. App layer — import-checks the FastAPI + Streamlit modules and runs
  #    the FastAPI TestClient integration tests.
  # --------------------------------------------------------------------- #
  app-layer-syntax-check:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import-check the API and dashboard modules
        run: |
          python3 -c "import src.app.api"
          python3 -m py_compile src/app/dashboard.py
      - name: Run API integration tests (FastAPI TestClient)
        run: pytest -q tests/test_api.py

  # --------------------------------------------------------------------- #
  # 7. Drift check — Requires real network access, since it polls live 
  #    Open-Meteo data, compares it against the training-time Feature Store
  #    via Evidently + River ADWIN, and automatically retrains and promotes
  #    a new champion if a retrain is indicated.
  #    Runs on every push/PR (report-only via --no-auto-retrain, so PRs
  #    can't accidentally promote a new Production model) and, separately,
  #    on the nightly cron with full auto-retrain enabled.
  # --------------------------------------------------------------------- #
  drift-check:
    needs: ml-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 scripts/run_pipeline.py
      - run: python3 scripts/train_models.py
      - name: Drift check (report-only on push/PR)
        if: github.event_name != 'schedule'
        run: python3 scripts/run_drift_check.py --n-polls 20 --poll-interval-seconds 1 --no-auto-retrain
      - name: Drift check with auto-retrain + promotion (nightly cron only)
        if: github.event_name == 'schedule'
        run: python3 scripts/run_drift_check.py --n-polls 30 --poll-interval-seconds 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: drift-check-mlruns, path: mlruns/ }

  # --------------------------------------------------------------------- #
  # 8. Docker — Builds all 3 images (pipeline, API, dashboard)
  # --------------------------------------------------------------------- #
  docker-build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pipeline image
        run: docker build -f docker/Dockerfile -t energy-forecast-pipeline:ci .
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t energy-forecast-api:ci .
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t energy-forecast-dashboard:ci .
